[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-game-balancing-thesis"
version = "0.1.0"
description = "Code and evidence for a thesis on constrained procedural game balancing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.2",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluation*", "generator*", "opponents*", "sap_thesis_env*"]
namespaces = true

[tool.setuptools.package-data]
sap_thesis_env = [
  "vendor/sapai_frozen/LICENSE",
  "vendor/sapai_frozen/sapai/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["sap_thesis_env/tests", "generator/tests", "evaluation/tests"]
